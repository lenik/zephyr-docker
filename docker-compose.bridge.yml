# Bridge: container listens on internal ports; host publishes mapped ports.
services:
  zephyr:
    ports:
      - "${HOST_BACKEND_HTTP_PORT:-6990}:${BACKEND_HTTP_PORT:-8080}"
      - "${HOST_BACKEND_HTTPS_PORT:-6991}:${BACKEND_HTTPS_PORT:-8443}"
      - "${HOST_WEB_HTTP_PORT:-8990}:${WEB_HTTP_PORT:-80}"
      - "${HOST_WEB_HTTPS_PORT:-8991}:${WEB_HTTPS_PORT:-443}"
      - "${HOST_MOBILE_WEB_PORT:-18990}:${MOBILE_WEB_PORT:-8081}"
